<main>

    <!-- Selected event is rendered here by JavaScript -->
    <div id="eventContainer"></div>


    <!-- ================= REGISTRATION MODAL ================= -->
    <div class="modal fade"
         id="registrationModal"
         tabindex="-1"
         aria-labelledby="registrationModalLabel"
         aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header text-white"
                     style="background-color: var(--primary, #14213D);">

                    <h5 class="modal-title text-white" id="registrationModalLabel">
                        Event Registration
                    </h5>

                    <button type="button" class="btn-close btn-close-white"
                            data-bs-dismiss="modal" aria-label="Close">
                    </button>

                </div>


                <div class="modal-body">

                    <form action="register.html" method="get">

                        <input type="hidden" name="event" id="eventNameField" value="">

                        <div class="mb-3">
                            <label for="studentName" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="studentName"
                                   name="studentName" placeholder="Enter your full name" required>
                        </div>

                        <div class="mb-3">
                            <label for="rollNumber" class="form-label">Roll Number</label>
                            <input type="text" class="form-control" id="rollNumber"
                                   name="rollNumber" placeholder="Enter your roll number" required>
                        </div>

                        <div class="mb-3">
                            <label for="studentEmail" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="studentEmail"
                                   name="studentEmail" placeholder="example@email.com" required>
                        </div>

                        <div class="mb-3">
                            <label for="studentPhone" class="form-label">Phone Number</label>
                            <input type="tel" class="form-control" id="studentPhone"
                                   name="studentPhone" placeholder="Enter phone number" required>
                        </div>

                        <div class="mb-3">
                            <label for="department" class="form-label">Department</label>
                            <select class="form-select" id="department" name="department" required>
                                <option value="">Select Department</option>
                                <option>Computer Science</option>
                                <option>Software Engineering</option>
                                <option>Information Technology</option>
                                <option>Business Administration</option>
                                <option>Media Studies</option>
                            </select>
                        </div>

                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="agreeTerms" required>
                            <label class="form-check-label" for="agreeTerms">
                                I agree to the event registration rules.
                            </label>
                        </div>

                        <button type="submit" class="btn register-btn w-100">
                            Submit Registration
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</main>

    // ================= HELPERS =================
    function listItems(arr) {
        return arr.map(function (item) { return "<li>" + item + "</li>"; }).join("");
    }

    // Event ID URL se lena: event-details.html?id=3  (ya #event-3)
    function getEventId() {
        var params = new URLSearchParams(window.location.search);
        var id = parseInt(params.get("id"), 10);

        if (!id && window.location.hash) {
            var match = window.location.hash.match(/event-(\d+)/);
            if (match) { id = parseInt(match[1], 10); }
        }
        return id || 1;
    }

    // ================= RENDER =================
    function renderEvent(ev) {
        var scheduleRows = ev.schedule.map(function (row) {
            return "<tr><td>" + row[0] + "</td><td>" + row[1] + "</td></tr>";
        }).join("");

        var otherEvents = events.map(function (e) {
            var cls = e.id === ev.id ? "other-event-link current" : "other-event-link";
            return '<a class="' + cls + '" href="event-details.html?id=' + e.id + '">' +
                   '<i class="bi bi-calendar-event me-2"></i>' + e.shortName + '</a>';
        }).join("");

<!-- HERO -->
<section class="details-hero">

        <h1 class="display-5 fw-bold text-white">${ev.title}</h1>
        <p class="lead text-white">${ev.tagline}</p>
    </div>
</section>

<!-- EVENT INFORMATION -->
<section class="container py-5">
    <div class="row g-4 align-items-start">

        <!-- IMAGE AND DESCRIPTION -->
        <div class="col-12 col-lg-8">

            <div class="details-card">

                ${ev.about.map(function (p) { return "<p>" + p + "</p>"; }).join("")}

                <h5 class="section-title mt-4">Event Highlights</h5>
                <ul>${listItems(ev.highlights)}</ul>
            </div>
        </div>

                </div>

                </div>
                <div class="info-item">
                    <i class="bi bi-geo-alt"></i><strong>Venue:</strong>
                    <p class="ms-4 mb-0">${ev.venue}</p>
                </div>
                <div class="info-item">
                    <i class="bi bi-cash"></i><strong>Registration Fee:</strong>
                    <p class="ms-4 mb-0">${ev.fee}</p>
                </div>
                <div class="info-item">

                    <p class="ms-4 mb-0">${ev.category}</p>
                </div>

                <div class="d-grid mt-4">
                    <button type="button" class="btn register-btn"
                            data-bs-toggle="modal"
                            data-bs-target="#registrationModal"
                            data-event="${ev.shortName}">
                        <i class="bi bi-pencil-square"></i> Register Now
                    </button>
                </div>

                <a href="events.html" class="btn btn-outline-secondary w-100 mt-3">

                    <ul>${listItems(rules)}</ul>
                </div>
            </div>
        </div>

    </div>
</section>`;

        document.getElementById("eventContainer").innerHTML = html;

    var selected = events.find(function (e) { return e.id === currentId; }) || events[0];
    renderEvent(selected);

    // Registration form ko batana ke kaunsa event hai
    document.getElementById("registrationModal").addEventListener("show.bs.modal", function (e) {
        var btn = e.relatedTarget;
        if (btn && btn.dataset.event) {
            document.getElementById("eventNameField").value = btn.dataset.event;
        }
    });
</script>
